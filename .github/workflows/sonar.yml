name: SonarCloud

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    sonar:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@v2
              with:
                  projectKey: TON_PROJECT_KEY
                  organization: TON_ORG
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
